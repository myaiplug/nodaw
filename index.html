<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoDAW — Professional Audio Suite</title>
  <meta name="description" content="NoDAW gives creators powerful audio workflows without forcing them into a full DAW. Convert, trim, process, export — browser-native." />
  <meta name="theme-color" content="#000000" />

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --theme-bg: #000000;
      --theme-surface: rgba(8, 10, 14, 0.82);
      --theme-surface-2: rgba(18, 20, 28, 0.72);
      --theme-border: rgba(51, 65, 85, 0.4);
      --theme-border-active: rgba(6, 182, 212, 0.38);
      --theme-primary: #e2e8f0;
      --theme-secondary: #94a3b8;
      --theme-muted: #64748b;
      --theme-dim: #475569;
      --theme-accent: #06b6d4;
      --theme-accent-glow: rgba(6, 182, 212, 0.15);
      --theme-emerald: #10b981;
      --theme-gold: #facc15;
      --theme-red: #ef4444;
      --theme-purple: #a855f7;
      --font-mono: 'JetBrains Mono', monospace;
      --font-tech: 'Rajdhani', sans-serif;
      --font-body: 'Manrope', sans-serif;
      --font-display: 'Syncopate', sans-serif;
    }
    body {
      font-family: var(--font-body);
      background-color: var(--theme-bg);
      color: var(--theme-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--theme-dim); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--theme-secondary); }
    .ad-container { min-height: 90px; display: flex; align-items: center; justify-content: center; }
    .ad-container ins { min-height: 90px; }
  </style>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9580768376514550"
    crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
